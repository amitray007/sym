# Local lab: Postgres for the ledger. Start it with `pnpm db:up`. Deployments use
# deploy/compose.yaml (decision 040).
# The host port is 55432, so it does not clash with a Postgres already on 5432.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sym
      POSTGRES_PASSWORD: sym
      POSTGRES_DB: sym
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sym -d sym"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres:
