# Sym — Slack app manifest (template)
#
# This is the canonical source of truth for the Slack app's display info,
# OAuth scopes, event subscriptions, and feature flags. Render with
# `pnpm manifest:render` (substitutes ${SLACK_PUBLIC_BASE_URL} from env)
# and paste the output into Slack's app config / `slack manifest update`.
#
# Env vars used:
#   SLACK_PUBLIC_BASE_URL  Public HTTPS base for redirect + events
#                          (e.g. https://your-tunnel.ngrok-free.dev in dev,
#                          your prod URL in prod).

display_information:
  name: Sym
  description: AI teammate that lives in Slack
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  assistant_view:
    assistant_description: Your AI plus-one in Slack — always online, never on PTO.
    suggested_prompts:
      - title: Catch me up with #general
        message: Summarize #general from the last few hours
      - title: Look someone up
        message: Who is @Amit? What's their role and current status?
      - title: What can you do?
        message: What can you help me with?
  bot_user:
    display_name: Sym
    always_online: true
  # Slash commands — single universal entry. The owner can fire `/sym <text>`
  # from any channel or DM; non-owner invocations are silently ACK'd by the
  # agent (the slash command surface stays cosmetically functional without
  # exposing Sym to the workspace). See apps/agent/src/server.ts → /slack/commands.
  slash_commands:
    - command: /sym
      url: ${SLACK_PUBLIC_BASE_URL}/slack/commands
      description: Ask Sym anything — recap, search, post, remind, find people
      usage_hint: '<question or instruction>'
      should_escape: false
oauth_config:
  redirect_urls:
    - ${SLACK_PUBLIC_BASE_URL}/slack/oauth/callback
  scopes:
    # ── USER scopes — granted when the owner installs the app. Used by tools
    # declared `actor: 'user'` so Sym can act with the owner's identity and
    # full Slack visibility. The User OAuth Token (xoxp-…) goes into
    # SLACK_OWNER_USER_TOKEN.
    user:
      # Search — Slack's real `search.messages` requires the user scope
      # (bot tokens cannot hold it). Powers the search_messages tool.
      - search:read
      # History reads across every surface the owner participates in.
      # Lets read_channel / read_thread see private channels and DMs
      # without Sym needing to be added as a member.
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      # Profile reads.
      - users:read
      - users:read.email
      # Phase B — act-as-owner writes.
      - chat:write # post_as_owner
      - reactions:write # react_as_owner
      - reactions:read
      - users.profile:write # set_status
      - reminders:write # add_reminder
      - reminders:read
      # Misc useful surfaces (files / canvases / emoji) — covered now so
      # Phase B+C feature work doesn't require another reinstall round.
      - files:read
      - emoji:read
      - canvases:read
      - canvases:write
    # ── BOT scopes — Sym's identity. Used for replies, streaming, assistant
    # panel state, status shimmer. Bot tokens cannot hold `search:read` — the
    # search_messages tool routes to the user token instead.
    bot:
      # Core messaging.
      - app_mentions:read
      - assistant:write
      - chat:write
      - commands
      # History readers — used when SLACK_OWNER_USER_TOKEN is NOT configured
      # (the user actor falls back to bot for non-destructive reads).
      - channels:history
      - groups:history
      - im:history
      - im:read
      # Group-DM (mpim) support: receive + read messages in multi-person DMs
      # Sym is added to, so an @mention there delivers a `message.mpim` event.
      - mpim:history
      - mpim:read
      # List / profile / channel discovery (bot fallback path).
      - channels:read
      - groups:read
      - users:read
      - users:read.email
settings:
  # Interactivity & Shortcuts — required for confirmation buttons (Phase B
  # write tools) and for slash commands to deliver a response_url back to
  # the agent. The endpoint owner-gates clicks the same way /slack/events
  # gates messages.
  interactivity:
    is_enabled: true
    request_url: ${SLACK_PUBLIC_BASE_URL}/slack/interactivity
  event_subscriptions:
    request_url: ${SLACK_PUBLIC_BASE_URL}/slack/events
    bot_events:
      - app_mention
      - message.im
      # Group DM: Slack delivers every message in an mpim Sym is a member of;
      # the agent acts only on those that @mention Sym (see normalize.ts).
      - message.mpim
      # Assistant container lifecycle — drives setTitle + setSuggestedPrompts
      # in apps/agent/src/assistant.ts.
      - assistant_thread_started
      - assistant_thread_context_changed
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: true
