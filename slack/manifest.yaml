# Slack app manifest for Sym. Import it at https://api.slack.com/apps (Create New App > From a manifest).
# Replace https://sym.example.com with your public host. Eve serves events, interactivity,
# and slash commands at the same route: /eve/v1/slack.
display_information:
  name: Sym
  description: Hands work to coding agents and reports back only what matters.
  background_color: "#1a1d21"
features:
  bot_user:
    display_name: sym
    always_online: true
  app_home:
    # The Home tab shows the dashboard (docs/slack.md). Reinstall the app after enabling it.
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /sym
      url: https://sym.example.com/eve/v1/slack
      description: Status, quiet mode, schedules, and persona
      usage_hint: status | jobs | schedules | quiet [minutes|off] | persona [name]
      should_escape: false
  # Slack code channels (decision 067). Sym opens one per started job only when SYM_CODE_CHANNELS
  # is on. Reinstall the app after you add this.
  code_channels:
    enabled: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      # The thread status line (assistant.threads.setStatus).
      - assistant:write
      - chat:write
      - commands
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      # Custom emoji for reactions (emoji.list, decision 051).
      - emoji:read
      - files:read
      - files:write
      - reactions:read
      - reactions:write
      - users:read
      # Code channels: create, archive, status, and context bar (decision 067). Eve reads
      # conversations.info to tell a code channel apart, which needs the read scopes.
      - code_channels:manage
      - channels:read
      - groups:read
      - mpim:read
      # Invite people only on request (decision 074). Reinstall the app for these scopes.
      - channels:write.invites
      - groups:write.invites
settings:
  event_subscriptions:
    request_url: https://sym.example.com/eve/v1/slack
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - app_home_opened
      # The Stop button on a code channel's session.
      - agent_session_stopped
  interactivity:
    is_enabled: true
    request_url: https://sym.example.com/eve/v1/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
