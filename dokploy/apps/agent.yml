# dokploy/apps/agent.yml
#
# Dokploy app configuration for apps/agent (Hono).
# The agent is configured entirely by env — no DB, no Redis.

# ── Metadata ──────────────────────────────────────────────────────────────────
name: sym-agent
description: 'Sym agent — Hono, Slack adapter, Pi brain'

# ── Build ─────────────────────────────────────────────────────────────────────
build:
  type: dockerfile
  # TODO: dockerfile: apps/agent/Dockerfile
  context: .

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  port: 3001
  healthcheck: /health

# ── Env vars ─────────────────────────────────────────────────────────────────
# Set these in Dokploy → App → Environment. See dokploy/env-template.txt.
env:
  # Node
  - NODE_ENV
  # Slack (required)
  - SLACK_SIGNING_SECRET
  - SLACK_BOT_TOKEN
  - SLACK_BOT_USER_ID
  - SLACK_TEAM_ID
  # Owner
  - SYM_OWNER_SLACK_USER_ID
  # Owner user token (optional — unlocks real workspace search + act-as-owner)
  - SLACK_OWNER_USER_TOKEN
  # Fireworks (required)
  - FIREWORKS_API_KEY
  - FIREWORKS_MODEL
  # Fireworks (optional — defaults to https://api.fireworks.ai/inference/v1)
  - FIREWORKS_BASE_URL
  # Agent (optional — defaults to 3001)
  - AGENT_PORT
  # MCP / connectors (optional unless using OAuth connectors)
  - SYM_PUBLIC_URL
  - SYM_ENCRYPTION_KEY
  - SYM_DB_PATH
  - SYM_CONFIG_PATH
  - SYM_MCP_SERVERS
  - SYM_MCP_CONNECT_TIMEOUT_MS
  # Operator / CLI (optional — all have safe defaults)
  - SYM_CLI_ALLOWLIST
  - SYM_CLI_CONFIRM
  - SYM_ADMIN_URL
  # Behavior knobs (optional — all have safe defaults)
  - TASK_CARD_THRESHOLD
  - TASK_CARD_AFTER
  - OWNER_POST_MARKER

# ── Hooks ─────────────────────────────────────────────────────────────────────
hooks:
  pre_deploy: sh dokploy/deploy-hooks/pre-deploy.sh
  post_deploy: sh dokploy/deploy-hooks/post-deploy.sh
