# dokploy/apps/agent.yml
#
# Dokploy app configuration for apps/agent (Hono).
# The agent is configured entirely by env — no DB, no Redis.

# ── Metadata ──────────────────────────────────────────────────────────────────
name: sym-agent
description: 'Sym agent — Hono, Slack adapter, Pi brain'

# ── Build ─────────────────────────────────────────────────────────────────────
build:
  type: dockerfile
  # TODO: dockerfile: apps/agent/Dockerfile
  context: .

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  port: 3001
  healthcheck: /health

# ── Env vars ─────────────────────────────────────────────────────────────────
# Set these in Dokploy → App → Environment. See dokploy/env-template.txt.
env:
  # Node
  - NODE_ENV
  # Slack (required)
  - SLACK_SIGNING_SECRET
  - SLACK_BOT_TOKEN
  - SLACK_BOT_USER_ID
  - SLACK_TEAM_ID
  # Owner
  - SYM_OWNER_SLACK_USER_ID
  # Fireworks (required)
  - FIREWORKS_API_KEY
  - FIREWORKS_MODEL
  # Fireworks (optional — defaults to https://api.fireworks.ai/inference/v1)
  - FIREWORKS_BASE_URL
  # Agent (optional — defaults to 3001)
  - AGENT_PORT

# ── Hooks ─────────────────────────────────────────────────────────────────────
hooks:
  pre_deploy: sh dokploy/deploy-hooks/pre-deploy.sh
  post_deploy: sh dokploy/deploy-hooks/post-deploy.sh
