# Change-policy classifier eval set for @sym/memory.
#
# Covers the four decisions: add, update, supersede, ignore.
# 20 cases; ~5 per decision class.
#
# Thresholds (initial, tunable via workspace_settings):
#   - Repetition for lift-above-ignore: 2 occurrences across turns
#   - Minimum word count for non-explicit candidates: 4 words
#   - Pass threshold for this eval set: ≥ 85% (17/20 correct)
#   - Per-class floor: ≥ 3/5 correct per decision class
#
# Provider: configured separately in promptfoo.yaml (injected, not hardcoded).
# Model: accounts/fireworks/models/llama-v3p3-70b-instruct (default)
#
# Run: pnpm promptfoo eval --config packages/memory/evals/change-policy.yaml

description: 'Memory change-policy classifier — 20-case eval'

prompts:
  - |
    You are the memory change-policy classifier for Sym, an AI teammate.

    Your job: given a conversation turn and a candidate memory fact, decide what should happen to Sym's memory.

    Return ONLY a JSON object in this exact shape (no markdown, no commentary):
    {"decision": "<add|update|supersede|ignore>", "reason": "<one sentence>", "existing_id": "<id or null>"}

    Rules:
    - "add": the candidate is a new, independent fact not covered by any existing memory.
    - "update": the candidate refines, sharpens, or adds detail to an existing memory without contradicting it. Set existing_id to the id of the memory being refined.
    - "supersede": the candidate directly contradicts an existing memory. Set existing_id to the id of the memory being superseded.
    - "ignore": the candidate is chitchat, a single passing mention with no intent to remember, Sym's own output quoted back, or failed/hypothetical tool calls.

    Substantive signals that must NOT be ignored:
    - Explicit: "remember this", "from now on", "always", "never", "please note"
    - Preference: "I prefer X", "I always use X", "I never do X", "my preference is X"
    - Repeated fact (appears ≥2 times across turns — the caller has already determined this)

    When in doubt, prefer "ignore" for casual one-liners. Prefer "add" for clear new facts.
    Return JSON only.

providers:
  - id: openai:chat:accounts/fireworks/models/llama-v3p3-70b-instruct
    config:
      apiBaseUrl: 'https://api.fireworks.ai/inference/v1'
      temperature: 0

tests:
  # ─── ADD cases ─────────────────────────────────────────────────────────────

  - description: "add-1: explicit 'remember this' + new fact"
    vars:
      turn_text: 'Please remember this: I always deploy on Fridays after 4pm.'
      candidate: 'User always deploys on Fridays after 4pm'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'add';

  - description: "add-2: preference statement ('I prefer')"
    vars:
      turn_text: 'I prefer async communication over meetings.'
      candidate: 'User prefers async communication over meetings'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'add';

  - description: "add-3: 'from now on' directive"
    vars:
      turn_text: 'From now on, always use British English spelling in your responses.'
      candidate: 'User wants British English spelling'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'add';

  - description: 'add-4: repeated fact (repetitionCount=2)'
    vars:
      turn_text: 'Yeah, I run Linux, just like I said before.'
      candidate: 'User runs Linux'
      existing_memories: 'none'
      repetition_count: '2'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'add';

  - description: 'add-5: clear new fact with no existing memories'
    vars:
      turn_text: "I'm the backend lead at Acme Corp."
      candidate: 'User is the backend lead at Acme Corp'
      existing_memories: 'none'
      repetition_count: '3'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'add';

  # ─── UPDATE cases ──────────────────────────────────────────────────────────

  - description: 'update-1: sharpens existing preference without contradicting'
    vars:
      turn_text: 'Actually, I prefer 4-space tabs, not just tabs.'
      candidate: 'User prefers 4-space tabs'
      existing_memories: 'id=mem-1 content="User prefers tabs"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'update' && parsed.existing_id === 'mem-1';

  - description: 'update-2: adds detail to existing fact'
    vars:
      turn_text: "Yeah, I'm still in London — specifically in Shoreditch."
      candidate: 'User is in Shoreditch, London'
      existing_memories: 'id=mem-2 content="User is in London"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'update' && parsed.existing_id === 'mem-2';

  - description: 'update-3: corrects minor spelling/wording in existing memory'
    vars:
      turn_text: "It's TypeScript with a capital S, if you note it down."
      candidate: 'User uses TypeScript'
      existing_memories: 'id=mem-3 content="User uses Typescript"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'update' && parsed.existing_id === 'mem-3';

  - description: 'update-4: refines frequency of a habit'
    vars:
      turn_text: 'I do code reviews every morning, not just sometimes.'
      candidate: 'User does code reviews every morning'
      existing_memories: 'id=mem-4 content="User does code reviews sometimes"'
      repetition_count: '2'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'update' && parsed.existing_id === 'mem-4';

  - description: 'update-5: adds specificity to a general preference'
    vars:
      turn_text: 'I use dark mode everywhere — especially in VS Code.'
      candidate: 'User uses dark mode in VS Code'
      existing_memories: 'id=mem-5 content="User prefers dark mode"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'update' && parsed.existing_id === 'mem-5';

  # ─── SUPERSEDE cases ───────────────────────────────────────────────────────

  - description: 'supersede-1: location changed'
    vars:
      turn_text: 'I moved to Berlin last month.'
      candidate: 'User is in Berlin'
      existing_memories: 'id=mem-10 content="User is in London"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'supersede' && parsed.existing_id === 'mem-10';

  - description: 'supersede-2: role changed'
    vars:
      turn_text: "I'm now the CTO, not an IC anymore."
      candidate: 'User is CTO'
      existing_memories: 'id=mem-11 content="User is a senior engineer"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'supersede' && parsed.existing_id === 'mem-11';

  - description: 'supersede-3: preference reversal'
    vars:
      turn_text: 'Actually I hate dark mode now, I switched to light mode.'
      candidate: 'User prefers light mode'
      existing_memories: 'id=mem-12 content="User prefers dark mode"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'supersede' && parsed.existing_id === 'mem-12';

  - description: 'supersede-4: OS change'
    vars:
      turn_text: 'I switched to macOS from Linux a few weeks ago.'
      candidate: 'User uses macOS'
      existing_memories: 'id=mem-13 content="User runs Linux"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'supersede' && parsed.existing_id === 'mem-13';

  - description: "supersede-5: explicit 'never' overriding previous 'always'"
    vars:
      turn_text: 'Never schedule standups before 10am — I changed my mind.'
      candidate: 'User never wants standups before 10am'
      existing_memories: 'id=mem-14 content="User prefers 9am standups"'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'supersede' && parsed.existing_id === 'mem-14';

  # ─── IGNORE cases ──────────────────────────────────────────────────────────

  - description: 'ignore-1: casual chitchat, single mention'
    vars:
      turn_text: 'haha yeah coffee is great'
      candidate: 'likes coffee'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'ignore';

  - description: "ignore-2: Sym's own output quoted back"
    vars:
      turn_text: "you said: 'I will help you schedule the meeting'"
      candidate: 'will schedule a meeting'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'ignore';

  - description: 'ignore-3: hypothetical / conditional statement'
    vars:
      turn_text: 'If I were in London, I would use the Tube every day.'
      candidate: 'User would use the Tube'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'ignore';

  - description: 'ignore-4: failed tool call context'
    vars:
      turn_text: 'The GitHub search timed out again. Forget it.'
      candidate: 'GitHub search failed'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'ignore';

  - description: 'ignore-5: joke / sarcasm with no signal'
    vars:
      turn_text: "I'm definitely a morning person... said no developer ever lol"
      candidate: 'User is a morning person'
      existing_memories: 'none'
      repetition_count: '1'
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.decision === 'ignore';

# ─── Threshold documentation ─────────────────────────────────────────────────
#
# Target pass rate: ≥ 85% (17/20 cases correct).
# Per-class floor:  ≥ 3/5 per decision class (add, update, supersede, ignore).
#
# These thresholds are STARTING POINTS. They are tunable per workspace via
# workspace_settings keys:
#   memory.classifier.pass_threshold       (default: 0.85)
#   memory.classifier.repetition_threshold (default: 2)
#   memory.classifier.min_candidate_words  (default: 4)
#
# Iterate on failing cases by adding more examples and re-running:
#   pnpm promptfoo eval --config packages/memory/evals/change-policy.yaml
