# Substance-diff guard accuracy eval
#
# Tests the checkSubstanceDiff() function with fixture pairs.
# Each case documents whether the guard should accept or reject the rewrite.
#
# Thresholds:
#   - Tone-only → accepted: ≥ 90 %
#   - Fact-change → rejected: ≥ 95 %
#
# Provider: runs checkSubstanceDiff via a lightweight wrapper script.
# For CI, the vitest unit tests in substance-diff.test.ts cover the same cases.

description: 'Substance-diff guard — tone-only accept vs fact-change reject'

providers:
  - id: 'file://./substance-diff-provider.js'
    label: 'substance-diff-guard'

tests:
  # -----------------------------------------------------------------------
  # Tone-only changes — guard MUST accept (accepted: true)
  # -----------------------------------------------------------------------

  - description: 'TONE-ONLY: rephrasing with same number'
    vars:
      original: 'There are 5 open issues in the queue.'
      rewritten: 'The queue currently has 5 open issues.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: passive to active voice'
    vars:
      original: 'The deployment was completed by the team at 2 AM.'
      rewritten: 'The team completed the deployment at 2 AM.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: adding a filler adverb'
    vars:
      original: 'The server responded in 120 ms.'
      rewritten: 'The server responded in approximately 120 ms.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: formal synonym substitution (no numbers)'
    vars:
      original: 'We made a big improvement to performance.'
      rewritten: 'We made a significant improvement to performance.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: identical text'
    vars:
      original: 'The server is running at port 3000.'
      rewritten: 'The server is running at port 3000.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: acknowledgement phrases (no claims in either)'
    vars:
      original: 'Sure, happy to help!'
      rewritten: "Absolutely, I'd be glad to assist."
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: reordering words around same number'
    vars:
      original: '12 PRs were merged yesterday.'
      rewritten: 'Yesterday, 12 PRs were merged.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  - description: 'TONE-ONLY: adding emoji-equivalent phrase (no facts)'
    vars:
      original: 'All tests passed.'
      rewritten: 'Great news — all tests passed.'
      expectedAccepted: true
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === true

  # -----------------------------------------------------------------------
  # Fact changes — guard MUST reject (accepted: false)
  # -----------------------------------------------------------------------

  - description: 'FACT-CHANGE: number mutation 5 → 6'
    vars:
      original: 'There are 5 open issues.'
      rewritten: 'There are 6 open issues.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: response time 120 ms → 200 ms'
    vars:
      original: 'The server responded in 120 ms.'
      rewritten: 'The server responded in 200 ms.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: percentage 80% → 90%'
    vars:
      original: 'Test coverage is 80%.'
      rewritten: 'Test coverage is 90%.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: entity name swap Alice → Bob'
    vars:
      original: 'Alice owns the repository.'
      rewritten: 'Bob owns the repository.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: added claim with a number'
    vars:
      original: 'The deployment is done.'
      rewritten: 'The deployment is done. It took 45 minutes.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: removed claim with a number'
    vars:
      original: 'There are 5 open PRs. The merge queue has 2 items.'
      rewritten: 'There are 5 open PRs.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: direction flip higher → lower'
    vars:
      original: 'The new version is higher performance than the old one.'
      rewritten: 'The new version is lower performance than the old one.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: date change March 15 → March 20'
    vars:
      original: 'The release is scheduled for March 15.'
      rewritten: 'The release is scheduled for March 20.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: port number 3000 → 4000'
    vars:
      original: 'The server is running at port 3000.'
      rewritten: 'The server is running at port 4000.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false

  - description: 'FACT-CHANGE: doubled a number'
    vars:
      original: 'The job runs every 5 minutes.'
      rewritten: 'The job runs every 10 minutes.'
      expectedAccepted: false
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          r.accepted === false
