# Cascade correctness eval
#
# These cases validate that the cascade resolver produces the correct layer
# order and effectiveMd content given a set of soul layers.  Since the
# resolver is pure-JS (no LLM calls), these are deterministic assertions
# run as promptfoo "custom" provider tests.
#
# Provider: use the `@sym/soul` package directly via a custom test script
# (see cascade-runner.ts if a live promptfoo run is needed; for CI, the
# vitest tests in cascade.test.ts cover the same assertions).

description: 'Soul cascade resolver — layer order and effectiveMd correctness'

providers:
  - id: 'file://./cascade-provider.js'
    label: 'cascade-resolver'

# Each test describes the input layers and the expected output properties.
tests:
  - description: 'L0 only — no DB rows'
    vars:
      layers: []
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.layers.length === 1 &&
          result.layers[0].kind === 'l0_global' &&
          result.effectiveMd.includes('Sym Global Voice')

  - description: 'L0 + L1 — workspace row'
    vars:
      layers:
        - layer: l1_workspace
          scopeId: null
          contentMd: 'Be concise and direct.'
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.layers.length === 2 &&
          result.layers[0].kind === 'l0_global' &&
          result.layers[1].kind === 'l1_workspace' &&
          result.effectiveMd.includes('Be concise and direct.')

  - description: 'L0 + L1 + L2 — channel row'
    vars:
      layers:
        - layer: l1_workspace
          scopeId: null
          contentMd: 'Workspace default voice.'
        - layer: l2_channel
          scopeId: 'C_ENG'
          contentMd: 'Engineering channel: be highly technical.'
      channelId: 'C_ENG'
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.layers.length === 3 &&
          result.layers[0].kind === 'l0_global' &&
          result.layers[1].kind === 'l1_workspace' &&
          result.layers[2].kind === 'l2_channel' &&
          result.effectiveMd.includes('Engineering channel')

  - description: 'L0 + L1 + L2 + L3 — full cascade'
    vars:
      layers:
        - layer: l1_workspace
          scopeId: null
          contentMd: 'Workspace default.'
        - layer: l2_channel
          scopeId: 'C_ENG'
          contentMd: 'Engineering channel.'
        - layer: l3_user
          scopeId: 'U_ALICE'
          contentMd: 'Alice prefers bullet points.'
      channelId: 'C_ENG'
      userId: 'U_ALICE'
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.layers.length === 4 &&
          result.layers[3].kind === 'l3_user' &&
          result.effectiveMd.includes('Alice prefers bullet points.')

  - description: 'Channel row for wrong channel is excluded'
    vars:
      layers:
        - layer: l2_channel
          scopeId: 'C_OTHER'
          contentMd: 'Wrong channel content.'
      channelId: 'C_ENG'
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.layers.length === 1 &&
          !result.effectiveMd.includes('Wrong channel content.')

  - description: 'effectiveMd separates layers with ---'
    vars:
      layers:
        - layer: l1_workspace
          scopeId: null
          contentMd: 'Workspace content here.'
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.effectiveMd.includes('---')

  - description: 'L0 always comes first regardless of DB rows'
    vars:
      layers:
        - layer: l3_user
          scopeId: 'U_BOB'
          contentMd: "Bob's preference."
      userId: 'U_BOB'
      workspaceId: 'ws_eval_001'
    assert:
      - type: javascript
        value: |
          const result = JSON.parse(output);
          result.layers[0].kind === 'l0_global'
