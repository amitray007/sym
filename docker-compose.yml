# docker-compose.yml — run the Sym agent (single deployable).
#
# The previous Postgres + Redis dev services were removed: the current agent is
# a single STATELESS deployable (the Slack thread is conversation memory). Its
# ONLY durable state is the credential store on the `sym_data` volume.
#
# Usage:
#   docker compose up --build          # build + run the agent
#   docker compose logs -f agent       # follow logs (look for "[mcp] pool warm …")
#
# Provide secrets/config via a repo-root .env (see docs/mcp-setup.md):
#   SLACK_SIGNING_SECRET, SLACK_BOT_TOKEN, SLACK_BOT_USER_ID, SLACK_TEAM_ID,
#   SYM_OWNER_SLACK_USER_ID, FIREWORKS_API_KEY, FIREWORKS_MODEL,
#   SYM_MCP_SERVERS (optional), and for OAuth connectors:
#   SYM_ENCRYPTION_KEY + SYM_PUBLIC_URL.

services:
  agent:
    build: .
    image: sym-agent
    container_name: sym-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3001:3001' # AGENT_PORT — Slack events / interactivity / OAuth callback
    volumes:
      # The only durable state: OAuth token store (SYM_DB_PATH=/data/credentials.db)
      # + any ambient CLI config dirs (Model B, e.g. CLOUDSDK_CONFIG=/data/gcloud).
      - sym_data:/data

volumes:
  sym_data:
