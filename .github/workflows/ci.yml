# Sym CI — runs on every push and pull request.
#
# Pipeline: install → typecheck → lint → test → build
#
# Tests are hermetic — no DB, no Postgres, no Redis required.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  # ─────────────────────────────────────────────
  # Main pipeline
  # ─────────────────────────────────────────────
  pipeline:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm 10)
        run: corepack enable

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit, with coverage)
        run: pnpm test:coverage

      - name: Test (integration — real-wire MCP/HTTP)
        run: pnpm test:integration

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      # ─────────────────────────────────────────────────────────────────────
      # Logging hygiene gate (Z16-01)
      #
      # Server/package code must NEVER use console.log — only console.info,
      # .warn, or .error. The sym CLI's --json mode spies on console.log
      # in-process so any server console.log races into the JSON output.
      #
      # Scopes: apps/agent/src (excluding cli/) + packages/**/*.ts(x)
      # The cli/ directory is the ONLY permitted user of console.log.
      #
      # False-positives that use `console.log` (no open paren) are:
      #   apps/agent/src/workspace-context.ts:101 — a plain comment
      # Both are safely excluded because the grep anchors on `console.log(`
      # (the call form with open paren).
      # ─────────────────────────────────────────────────────────────────────
      - name: No console.log outside cli/ (logging hygiene)
        run: |
          ! grep -rn --include="*.ts" --include="*.tsx" \
              "console\.log(" apps/agent/src packages \
              --exclude-dir=cli

      # ─────────────────────────────────────────────────────────────────────
      # Informational analysis steps — run after build, never block CI
      # ─────────────────────────────────────────────────────────────────────

      - name: Dependency graph analysis (depcruise)
        # Enforces the not-to-apps (packages→apps) rule at ERROR; all other
        # findings (orphans, cycles) are warnings. Runs informational-only —
        # continue-on-error keeps CI green while knip/cycles are pending C10.
        continue-on-error: true
        run: pnpm depcruise --output-type err

      - name: Dead code analysis (knip)
        # Reports unused files/exports/deps. Findings are for C10's reference;
        # do not fail CI yet (knip exits 1 when it has any findings).
        continue-on-error: true
        run: pnpm knip --reporter compact

  # ─────────────────────────────────────────────
  # promptfoo eval stub
  # TODO(S7a/S7d): wire real eval sets once they exist.
  # This job is intentionally a no-op so it doesn't fail CI.
  # Remove the "if: false" guard and fill in the eval command
  # when packages/memory and packages/soul ship their promptfoo configs.
  # ─────────────────────────────────────────────
  evals:
    name: promptfoo evals (stub — no-op until eval sets exist)
    runs-on: ubuntu-latest
    # Runs only on PRs touching memory, soul, or kernel packages.
    # The "if: false" ensures it's always skipped until eval sets exist.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # TODO(S7a): pnpm --filter @sym/memory exec promptfoo eval --ci
      # TODO(S7d): pnpm --filter @sym/soul exec promptfoo eval --ci
      - name: Placeholder
        run: echo "No eval sets yet — see TODO above."
