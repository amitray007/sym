name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · types · knip · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Same image as compose.yaml. Tests that need the ledger database use it.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sym
          POSTGRES_PASSWORD: sym
          POSTGRES_DB: sym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sym -d sym"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sym:sym@localhost:5432/sym
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
      # Compile only. Sym has no sandbox tools, and deploy images run the full `eve build`.
      - run: pnpm build:compile

  workflows:
    name: workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uvx zizmor@1.31.1 --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
