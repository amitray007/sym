# Sym CI — runs on every push and pull request.
#
# Mirrors the local pipeline exactly:
#   pnpm install --frozen-lockfile
#   → pnpm typecheck
#   → pnpm lint
#   → pnpm test       (requires Postgres for @sym/db)
#   → pnpm build
#
# DB tests need Postgres 16 and a generated SYM_ENCRYPTION_KEY.
# The db:migrate step runs before the test step to prime the schema.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # @sym/db — points at the service container below.
  DATABASE_URL: postgres://sym_ci:sym_ci@localhost:5432/sym_ci
  # @sym/secrets — 32-byte base64 key; generated fresh per run.
  # Real production key lives in Dokploy secrets, never in source.
  SYM_ENCRYPTION_KEY: ${{ secrets.SYM_ENCRYPTION_KEY_CI || '' }}
  # Redis — used from S1 onward; not yet needed for the existing test suite
  # but wired now so tests that add Redis deps don't need workflow changes.
  REDIS_URL: redis://localhost:6379

jobs:
  # ─────────────────────────────────────────────
  # Main pipeline
  # ─────────────────────────────────────────────
  pipeline:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sym_ci
          POSTGRES_USER: sym_ci
          POSTGRES_PASSWORD: sym_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sym_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm 10)
        run: corepack enable

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate a fresh encryption key if the repo secret is not set.
      # This lets forks and first-time contributors run CI without secrets.
      - name: Generate SYM_ENCRYPTION_KEY (if not provided)
        if: env.SYM_ENCRYPTION_KEY == ''
        run: |
          KEY=$(node -e "
            const { randomBytes } = await import('node:crypto');
            process.stdout.write(randomBytes(32).toString('base64'));
          " --input-type=module)
          echo "SYM_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate DB (schema must be current before tests)
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────
  # promptfoo eval stub
  # TODO(S7a/S7d): wire real eval sets once they exist.
  # This job is intentionally a no-op so it doesn't fail CI.
  # Remove the "if: false" guard and fill in the eval command
  # when packages/memory and packages/soul ship their promptfoo configs.
  # ─────────────────────────────────────────────
  evals:
    name: promptfoo evals (stub — no-op until eval sets exist)
    runs-on: ubuntu-latest
    # Runs only on PRs touching memory, soul, or kernel packages.
    # The "if: false" ensures it's always skipped until eval sets exist.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # TODO(S7a): pnpm --filter @sym/memory exec promptfoo eval --ci
      # TODO(S7d): pnpm --filter @sym/soul exec promptfoo eval --ci
      - name: Placeholder
        run: echo "No eval sets yet — see TODO above."

  # ─────────────────────────────────────────────
  # Smoke test stub
  # TODO(S3/S2): enable once apps/dashboard and apps/agent ship /health.
  # Deploy order: DB migration → Dashboard → Agent (enforced in Dokploy).
  # This job must NOT fail CI until both apps exist.
  # ─────────────────────────────────────────────
  smoke:
    name: smoke test (stub — TODO until apps exist)
    runs-on: ubuntu-latest
    # Always skipped until apps/dashboard and apps/agent exist.
    if: false
    steps:
      - name: Dashboard /health
        # TODO(S3): curl --fail https://$DASHBOARD_URL/health
        run: echo "TODO — apps/dashboard does not exist yet"
      - name: Agent /health
        # TODO(S2): curl --fail https://$AGENT_URL/health
        run: echo "TODO — apps/agent does not exist yet"
