name: Bug report
description: Report a bug in Sym
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, OS, how you run Sym (local dev / Docker), and relevant env vars (redact secrets).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server logs. The per-turn correlation id ([turn xxxxxxxx]) helps. REDACT tokens/secrets.
      render: text
    validations:
      required: false
