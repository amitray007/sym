name: Feature request
description: Suggest an idea or improvement for Sym
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Please open a Discussion before a feature PR (see CONTRIBUTING.md).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might Sym address it? Alternatives you considered.
    validations:
      required: false
