version: 2
updates:
  # The root lockfile covers the whole pnpm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Zero pauses version updates without disabling security updates.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
