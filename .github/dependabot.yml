version: 2
updates:
  # npm — the pnpm workspace (root + apps/agent + packages/*). Dependabot reads
  # the root pnpm-lock.yaml and covers the whole workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch dev-tooling bumps (eslint, prettier, turbo, vitest, tsx, types)
      # into a single PR to reduce noise.
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
